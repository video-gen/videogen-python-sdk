[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videogen"
version = "2.0.9"
description = "Official Python SDK for the VideoGen API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "VideoGen", email = "support@videogen.io" }]
keywords = ["videogen", "video", "api", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://docs.videogen.io"
Documentation = "https://docs.videogen.io/libraries/python"
Repository = "https://github.com/video-gen/videogen-python-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videogen = ["py.typed"]
